
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AITE | Neural Trading Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #060610;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }
    .jarvis-glow {
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 2px;
    }
    .glass-panel {
      background: rgba(16, 16, 36, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    @keyframes pulse-cyan {
      0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
    }
    .status-pulse {
      animation: pulse-cyan 2s infinite;
    }
    .neural-grid {
      background-image: linear-gradient(rgba(6, 182, 212, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(6, 182, 212, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    
    /* Sidebar Hover Effect */
    .sidebar-expanded {
      width: 256px !important;
    }
    .sidebar-transition {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lightweight-charts": "https://esm.sh/lightweight-charts@^4.2.1",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="neural-grid">
  <div id="root"></div>
</body>
</html>
