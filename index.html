
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a16">
  <meta name="description" content="AITE - Adaptive Intelligence Trading Ecosystem. AI-powered trading platform with neural analysis and automated bots.">
  <meta name="keywords" content="trading, AI, bot, deriv, forex, neural, automation">
  
  <!-- PWA Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  
  <title>AITE | Neural Trading Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: rgba(6, 182, 212, 0.1);
      -webkit-touch-callout: none;
    }
    
    /* Improve touch targets for mobile */
    button, a, input, select, textarea {
      touch-action: manipulation;
      min-height: 44px;
      min-width: 44px;
    }
    
    body {
      background-color: #060610;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
      width: 100%;
      max-width: 100vw;
    }
    
    #root {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    .safe-area-inset-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .jarvis-glow {
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 2px;
    }
    .glass-panel {
      background: rgba(16, 16, 36, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    @keyframes pulse-cyan {
      0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
    }
    .status-pulse {
      animation: pulse-cyan 2s infinite;
    }
    .neural-grid {
      background-image: linear-gradient(rgba(6, 182, 212, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(6, 182, 212, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    
    /* Sidebar Hover Effect */
    .sidebar-expanded {
      width: 256px !important;
    }
    .sidebar-transition {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Hide scrollbar utility */
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    
    /* Animation utilities */
    .animate-in {
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lightweight-charts": "https://esm.sh/lightweight-charts@^4.2.1",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="neural-grid">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
